<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bru-Sche-Sys | Login</title>
    <style>
        h1
        {
            margin-top: 0;
        }

        h2
        {
            margin-bottom: 8px;
        }

        h3
        {
            margin-bottom: 0;
        }

        .email, .password
        {
        margin-bottom: 8px;
        }

        button
        {
            margin-top: 32px;
        }
    </style>
</head>

<body>

    <form id="loginForm">
        <div class="header">
            <h3 class="subtitle">George Fox University</h3>
            <h2>Bruin Scheduling System</h2>
            <h1>Login</h1>
        </div>
        
        <div class="email">
            <!-- User enters their credentials
            Enter the user email
            Enter the user password -->
            <label for="emailInput"><h2>George Fox Email</h2></label>
            <input type="email" id="emailInput" placeholder="Enter email" required>
        </div>

        <div class="password">
            <label for="passwordInput"><h2>Password</h2></label>
            <input type="password" id="passwordInput" placeholder="Enter password" required>
        </div>
        
        <div class="show-hide-pw">
            <input type="checkbox" id="togglePassword"/>
            <label for="togglePassword">Show Password</label>
        </div>

        <div class="buttons">
            <!-- Create account button goes to the create account page.
            Login button redirects to home page.
            Login will eventually be redirected after it communicates with the server. -->
            <button onclick="window.location.href='home.html'">Login</button>
            <button onclick="window.location.href='account_create.html'">Create Account</button>
        </div>

        <div class="forgot-pw">
            <button onclick="window.location.href='forgot_password.html'">Forgot Password?</button>
        </div>
    </form>

    <!-- I had ai generate the view/hide password thing because I was lazy -->
    <script>
        const passwordInput = document.querySelector("#passwordInput");
        const toggleCheckbox = document.querySelector("#togglePassword");
        const loginForm = document.querySelector("#loginForm")

        toggleCheckbox.addEventListener("change", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
            } else {
                passwordInput.type = "password";
            }
        });

        loginForm.addEventListener("submit", function (e) {
            e.preventDefault();
            window.location.href = 'home.html';
        })
    </script>
    <!-- end of ai generated content -->

</body>
</html>
